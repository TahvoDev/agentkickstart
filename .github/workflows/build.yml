name: build

# Images are built/pushed on a hosted runner; the installer ISO needs a Fedora
# host (osbuild's grub2.iso stage reads the Fedora EFI shim from /boot/efi), so
# it runs on a self-hosted runner labelled "fedora".
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      # Pre-release tag: the box tracks :edge while testing. Promote a digest
      # to :latest (and optionally flip package visibility) at release.
      AGENT_TAG: edge
      OS_TAG: edge
    steps:
      - uses: actions/checkout@v4

      - name: lowercase owner (registry refs must be lowercase)
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_ENV"

      - name: podman
        run: command -v podman || { sudo apt-get update && sudo apt-get install -y podman; }

      # Pin both auth files to fixed, owner-correct paths. Relying on the
      # default store puts creds in /run/user/<uid>/containers/auth.json, which
      # a root login can clobber root-owned, breaking the non-root build.
      - name: ghcr login
        env:
          CR_TOKEN: ${{ github.token }}
        run: |
          AUTH="$HOME/.config/containers/auth.json"
          mkdir -p "$(dirname "$AUTH")"
          printf '%s' "$CR_TOKEN" | podman login --authfile "$AUTH" ghcr.io -u '${{ github.actor }}' --password-stdin
          echo "REGISTRY_AUTH_FILE=$AUTH" >> "$GITHUB_ENV"

      - name: build + push agent and OS images
        run: |
          ./build.sh agent
          ./build.sh os

  installer:
    needs: images
    # Self-hosted Fedora runner: podman + passwordless sudo, labelled "fedora".
    # Register with: ./config.sh --labels fedora  (see README).
    runs-on: [self-hosted, linux, fedora]
    env:
      OWNER: ${{ github.repository_owner }}
      AGENT_TAG: edge
      OS_TAG: edge
    steps:
      - uses: actions/checkout@v4

      - name: lowercase owner
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_ENV"

      - name: ghcr login (user + root)
        env:
          CR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$CR_TOKEN" | podman login ghcr.io -u '${{ github.actor }}' --password-stdin
          printf '%s' "$CR_TOKEN" | sudo podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: build installer ISO
        run: ./build.sh installer

      - uses: actions/upload-artifact@v4
        with:
          name: install-iso
          path: output/install.iso
          if-no-files-found: error
