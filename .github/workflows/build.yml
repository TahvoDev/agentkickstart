name: build

# Builds and pushes both images to GHCR and publishes the installer ISO, all on
# a hosted runner. The installer uses the `bootc-generic-iso` image type, whose
# kernel/EFI come from an installer container (os/iso) we build - no Fedora
# build host needed, unlike the bootc-installer type.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Doc-only changes don't need a rebuild.
    paths-ignore:
      - '**.md'

permissions:
  # write: create/update the rolling `edge` release the ISO is published to.
  contents: write
  packages: write
  # cosign keyless signing: the workflow's OIDC identity is the signer.
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      # The ISO embeds the OS image (not the agent), so an agent-only change
      # leaves it identical - skip the whole ISO rebuild in that case.
      os_changed: ${{ steps.os_changes.outputs.changed }}
    env:
      OWNER: ${{ github.repository_owner }}
      # Pre-release tag: the box tracks :edge while testing. Promote a digest
      # to :latest (and optionally flip package visibility) at release.
      AGENT_TAG: edge
      GATE_TAG: edge
      OS_TAG: edge
    steps:
      # Full history so the change-detection step can diff against the pushed
      # ref's parent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: lowercase owner (registry refs must be lowercase)
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_ENV"

      - name: did anything the ISO depends on change?
        id: os_changes
        run: |
          # Manual runs always rebuild; on push, only if os/ or build.sh moved.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed=true
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              changed=true
            elif git diff --quiet "$before" "$GITHUB_SHA" -- os build.sh; then
              changed=false
            else
              changed=true
            fi
          fi
          echo "os_changed=$changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: podman
        run: command -v podman || { sudo apt-get update && sudo apt-get install -y podman; }

      # Pin the auth file to a fixed path; the default store lives in
      # /run/user/<uid>/containers/auth.json which a root login can clobber.
      - name: ghcr login
        env:
          CR_TOKEN: ${{ github.token }}
        run: |
          AUTH="$HOME/.config/containers/auth.json"
          mkdir -p "$(dirname "$AUTH")"
          printf '%s' "$CR_TOKEN" | podman login --authfile "$AUTH" ghcr.io -u '${{ github.actor }}' --password-stdin
          echo "REGISTRY_AUTH_FILE=$AUTH" >> "$GITHUB_ENV"

      - name: build + push agent, gate and OS images
        run: |
          ./build.sh agent
          ./build.sh gate
          ./build.sh os

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      - name: sign images (keyless)
        run: |
          # Keyless: cosign signs with the runner's GitHub OIDC identity, no key.
          # cosign (go-containerregistry) reads the Docker config, not podman's
          # authfile, so bridge the login creds across.
          mkdir -p "$HOME/.docker"
          cp "$REGISTRY_AUTH_FILE" "$HOME/.docker/config.json"
          sign() {
            podman push --digestfile "$RUNNER_TEMP/digest" "$1"
            cosign sign --yes "$1@$(cat "$RUNNER_TEMP/digest")"
          }
          sign "ghcr.io/$OWNER/agentbox-agent:$AGENT_TAG"
          sign "ghcr.io/$OWNER/agentbox-gate:$GATE_TAG"
          sign "ghcr.io/$OWNER/agentbox-os:$OS_TAG"

      - name: verify signatures (self-check)
        run: |
          for image in "ghcr.io/$OWNER/agentbox-agent:$AGENT_TAG" "ghcr.io/$OWNER/agentbox-gate:$GATE_TAG" "ghcr.io/$OWNER/agentbox-os:$OS_TAG"; do
            cosign verify "$image" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@.*$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

  installer:
    needs: images
    # Skipped on agent-only pushes; the existing `edge` ISO already embeds the
    # current OS image.
    if: needs.images.outputs.os_changed == 'true'
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      AGENT_TAG: edge
      GATE_TAG: edge
      OS_TAG: edge
    steps:
      - uses: actions/checkout@v4

      - name: lowercase owner
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_ENV"

      - name: podman
        run: command -v podman || { sudo apt-get update && sudo apt-get install -y podman; }

      - name: free disk space (ISO build is heavy)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup

      # Ubuntu 26.04 ships the bwrap-userns-restrict AppArmor profile, which also
      # attaches to /usr/bin/bwrap inside the privileged image-builder container
      # and drops osbuild's stages into an unprivileged profile with no caps ->
      # "fchownat() ... Operation not permitted" then "mount: /run/osbuild/
      # containers/storage: permission denied". Install the supported local
      # include (the override bootc uses on its own runners); no-op on 24.04,
      # where the profile doesn't exist. Matters once ubuntu-latest bumps to 26.04.
      - name: keep bwrap in its parent AppArmor profile (Ubuntu 26.04)
        run: |
          if sudo test -r /etc/apparmor.d/bwrap-userns-restrict &&
             sudo test -r /sys/kernel/security/apparmor/profiles &&
             sudo grep -qx 'bwrap (enforce)' /sys/kernel/security/apparmor/profiles; then
            printf '%s\n' 'priority=100 allow file rwlkm /**,' 'priority=100 allow ix /**,' \
              | sudo tee /etc/apparmor.d/local/bwrap-userns-restrict >/dev/null
            sudo apparmor_parser -Q /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            echo "bwrap AppArmor override installed"
          else
            echo "bwrap-userns-restrict not enforced here; nothing to do"
          fi

      # Rootful podman builds the installer container and pulls the payload;
      # both live in /var/lib/containers/storage, which the builder mounts.
      - name: ghcr login (user + root)
        env:
          CR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$CR_TOKEN" | podman login ghcr.io -u '${{ github.actor }}' --password-stdin
          printf '%s' "$CR_TOKEN" | sudo podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: build installer ISO
        env:
          # image-builder prints per-stage timing at the end of the build.
          IB_METRICS: "1"
        run: ./build.sh installer

      # Publish the ISO on the rolling `edge` prerelease. Create it once, then
      # replace the asset each build (stable download URL:
      # .../releases/download/edge/install.iso). Uses the preinstalled gh CLI, no
      # extra action. NB: release assets cap at 2 GiB; install.iso is ~1.6 GiB.
      - name: publish installer ISO to the 'edge' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view edge >/dev/null 2>&1; then
            gh release edit edge --notes "Rolling edge build from ${GITHUB_SHA} ($(date -u +%Y-%m-%dT%H:%MZ))."
          else
            gh release create edge --prerelease --target "$GITHUB_SHA" \
              --title "agentbox installer (edge)" \
              --notes "Rolling edge build from ${GITHUB_SHA}."
          fi
          gh release upload edge output/install.iso --clobber
          gh release view edge --json assets \
            -q '.assets[] | select(.name=="install.iso") | "\(.name) \(.size) bytes"'
