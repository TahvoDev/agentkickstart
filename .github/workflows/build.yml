name: build

# Images build/push on a hosted runner. The installer ISO needs a native
# Fedora environment: osbuild uses the host as its build root there, so
# grub2.iso finds the EFI shim in /boot/efi. In a container osbuild builds a
# separate root without it, so a hosted Ubuntu runner can't build the ISO.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      # Pre-release tag: the box tracks :edge while testing. Promote a digest
      # to :latest (and optionally flip package visibility) at release.
      AGENT_TAG: edge
      OS_TAG: edge
    steps:
      - uses: actions/checkout@v4

      - name: lowercase owner (registry refs must be lowercase)
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_ENV"

      - name: podman
        run: command -v podman || { sudo apt-get update && sudo apt-get install -y podman; }

      # Pin the auth file to a fixed path; the default store lives in
      # /run/user/<uid>/containers/auth.json which a root login can clobber.
      - name: ghcr login
        env:
          CR_TOKEN: ${{ github.token }}
        run: |
          AUTH="$HOME/.config/containers/auth.json"
          mkdir -p "$(dirname "$AUTH")"
          printf '%s' "$CR_TOKEN" | podman login --authfile "$AUTH" ghcr.io -u '${{ github.actor }}' --password-stdin
          echo "REGISTRY_AUTH_FILE=$AUTH" >> "$GITHUB_ENV"

      - name: build + push agent and OS images
        run: |
          ./build.sh agent
          ./build.sh os

  installer:
    needs: images
    # Self-hosted Fedora host: podman, passwordless sudo for podman, and
    # image-builder installed (see README). Label the runner "fedora".
    runs-on: [self-hosted, linux, fedora]
    env:
      OWNER: ${{ github.repository_owner }}
      AGENT_TAG: edge
      OS_TAG: edge
    steps:
      - uses: actions/checkout@v4

      - name: lowercase owner
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_ENV"

      - name: image-builder
        run: command -v image-builder || sudo dnf install -y image-builder

      - name: ghcr login (user + root)
        env:
          CR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$CR_TOKEN" | podman login ghcr.io -u '${{ github.actor }}' --password-stdin
          printf '%s' "$CR_TOKEN" | sudo podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: build installer ISO
        run: ./build.sh installer

      - uses: actions/upload-artifact@v4
        with:
          name: install-iso
          path: output/install.iso
          if-no-files-found: error
