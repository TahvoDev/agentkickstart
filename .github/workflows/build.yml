name: build

# Builds and pushes both images to GHCR and publishes the installer ISO, all on
# a hosted runner. The installer uses the `bootc-generic-iso` image type, whose
# kernel/EFI come from an installer container (os/iso) we build - no Fedora
# build host needed, unlike the bootc-installer type.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Doc-only changes don't need a rebuild.
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  packages: write
  # cosign keyless signing: the workflow's OIDC identity is the signer.
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      # Pre-release tag: the box tracks :edge while testing. Promote a digest
      # to :latest (and optionally flip package visibility) at release.
      AGENT_TAG: edge
      OS_TAG: edge
    steps:
      - uses: actions/checkout@v4

      - name: lowercase owner (registry refs must be lowercase)
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_ENV"

      - name: podman
        run: command -v podman || { sudo apt-get update && sudo apt-get install -y podman; }

      # Pin the auth file to a fixed path; the default store lives in
      # /run/user/<uid>/containers/auth.json which a root login can clobber.
      - name: ghcr login
        env:
          CR_TOKEN: ${{ github.token }}
        run: |
          AUTH="$HOME/.config/containers/auth.json"
          mkdir -p "$(dirname "$AUTH")"
          printf '%s' "$CR_TOKEN" | podman login --authfile "$AUTH" ghcr.io -u '${{ github.actor }}' --password-stdin
          echo "REGISTRY_AUTH_FILE=$AUTH" >> "$GITHUB_ENV"

      - name: build + push agent and OS images
        run: |
          ./build.sh agent
          ./build.sh os

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      - name: sign images (keyless)
        run: |
          # Keyless: cosign signs with the runner's GitHub OIDC identity, no key.
          # cosign (go-containerregistry) reads the Docker config, not podman's
          # authfile, so bridge the login creds across.
          mkdir -p "$HOME/.docker"
          cp "$REGISTRY_AUTH_FILE" "$HOME/.docker/config.json"
          sign() {
            podman push --digestfile "$RUNNER_TEMP/digest" "$1"
            cosign sign --yes "$1@$(cat "$RUNNER_TEMP/digest")"
          }
          sign "ghcr.io/$OWNER/agentbox-agent:$AGENT_TAG"
          sign "ghcr.io/$OWNER/agentbox-os:$OS_TAG"

      - name: verify signatures (self-check)
        run: |
          for image in "ghcr.io/$OWNER/agentbox-agent:$AGENT_TAG" "ghcr.io/$OWNER/agentbox-os:$OS_TAG"; do
            cosign verify "$image" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build.yml@.*$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

  installer:
    needs: images
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      AGENT_TAG: edge
      OS_TAG: edge
    steps:
      - uses: actions/checkout@v4

      - name: lowercase owner
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_ENV"

      - name: podman
        run: command -v podman || { sudo apt-get update && sudo apt-get install -y podman; }

      - name: free disk space (ISO build is heavy)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup

      # Rootful podman builds the installer container and pulls the payload;
      # both live in /var/lib/containers/storage, which the builder mounts.
      - name: ghcr login (user + root)
        env:
          CR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$CR_TOKEN" | podman login ghcr.io -u '${{ github.actor }}' --password-stdin
          printf '%s' "$CR_TOKEN" | sudo podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: build installer ISO
        run: ./build.sh installer

      - uses: actions/upload-artifact@v4
        with:
          name: install-iso
          path: output/install.iso
          if-no-files-found: error
