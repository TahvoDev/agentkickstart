# Directories owned by specific container UIDs (the boxes' volumes and the
# places `agentbox setup` writes secrets). Created at boot by systemd-tmpfiles.
d /etc/agentbox               0700 root  root  -
d /etc/agent-vault            0700 root  root  -
d /var/lib/tailscale          0700 root  root  -
d /var/lib/agent-vault        0700 10002 10002 -
d /var/lib/agentbox           0755 root  root  -
d /var/lib/agentbox/home      0700 10001 10001 -
d /var/lib/agentbox/workspace 0755 10001 10001 -
