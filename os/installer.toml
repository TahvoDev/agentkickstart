# image-builder blueprint for the installer ISO (bootc-installer / Anaconda).
#
#   [LOCAL=1] ./build.sh installer      ->   output/install.iso
#
# Everything is entered in the interactive Anaconda UI: the target disk,
# "encrypt my data", and the admin user (tick "Make this user administrator"
# so it gets sudo/wheel). A %post script then binds the LUKS root to the TPM
# and mints a recovery key. Nothing machine-specific is baked here, so the ISO
# is generic and shareable.
#
# SSH key: Anaconda has no SSH-public-key field in any UI, so SSH starts with
# the password set for the admin user. The key is handled after install, by
# `sudo agentbox setup` (which installs it and offers key-only). (A custom
# kickstart `contents` is also incompatible with a [[customizations.user]]
# stanza, so the user cannot be declared here anyway.)
#
# UI: image-builder boots this ISO with "inst.text" (the text installer).
# Anaconda offers a newer Cockpit-based Web UI, chosen automatically when it is
# in graphical mode *and* the anaconda-webui package is present (Fedora 43+).
# Because --text/--graphical are last-wins, appending "inst.graphical" selects
# it; it falls back to text if the Web UI is unavailable. For a headless box add
# "inst.webui.remote" so you can drive the install from a browser (Cockpit on
# :9090) instead of a local display; "inst.webui.remote.pin=NNNN" requires a PIN.
# NOTE: the Web UI has no SSH-key field either, so it does not change the above.
#
# [customizations.kernel]
# append = "inst.graphical"

[customizations.installer.kickstart]
contents = """
graphical
rootpw --lock
%post --interpreter=/bin/bash --erroronfail
# The GUI set up the encrypted root; find the LUKS device behind it.
root=$(findmnt -n -o SOURCE /)
cryptdev=$(cryptsetup status "$root" 2>/dev/null | awk '/device:/{print $2}')
cryptdev=${cryptdev:-$(blkid -t TYPE=crypto_LUKS -o device | head -n1)}
# Bind to the TPM (PCR 7 = Secure Boot state) and print a recovery key.
systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs=7 "$cryptdev"
systemd-cryptenroll --recovery-key "$cryptdev" | tee /root/recovery-key.txt
%end
"""
